<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #EEEEEE; font-family: 'DM Sans', sans-serif; padding: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .row-label { width: 100%; font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #555368; margin-top: 4px; margin-bottom: 0; }
  .semantic-row { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
  .sem { background: #F9F7F3; border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; min-width: 170px; }
  .sem-dot { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; }
  .sem-name { font-size: 12px; font-weight: 600; color: #2A2A2A; }
  .sem-hex { font-family: 'Space Mono', monospace; font-size: 10px; color: #555368; }
  .sem-role { font-size: 10px; color: #787878; }
  .border-sample { background: #F9F7F3; border-radius: 8px; padding: 10px 14px; min-width: 200px; }
  .border-demo { border: 1px solid rgba(85,83,104,0.2); border-radius: 6px; padding: 8px 12px; font-size: 12px; color: #555368; margin-bottom: 6px; }
  .border-demo-strong { border: 1px solid rgba(85,83,104,0.4); border-radius: 6px; padding: 8px 12px; font-size: 12px; color: #555368; }
</style>
</head>
<body>
<p class="row-label">[ Semantic Colors ]</p>
<div class="semantic-row">
  <div class="sem"><div class="sem-dot" style="background:#28E99F;"></div><div><div class="sem-name">Success</div><div class="sem-hex">#28E99F</div><div class="sem-role">Positive / confirmed</div></div></div>
  <div class="sem"><div class="sem-dot" style="background:#E5443D;"></div><div><div class="sem-name">Error</div><div class="sem-hex">#E5443D</div><div class="sem-role">Failure / destructive</div></div></div>
  <div class="sem"><div class="sem-dot" style="background:#DAFF01;"></div><div><div class="sem-name">Warning</div><div class="sem-hex">#DAFF01</div><div class="sem-role">Caution / attention</div></div></div>
  <div class="sem"><div class="sem-dot" style="background:#5882FF;"></div><div><div class="sem-name">Info</div><div class="sem-hex">#5882FF</div><div class="sem-role">Informational</div></div></div>
</div>
<p class="row-label" style="margin-top:16px;">[ Borders ]</p>
<div class="border-sample">
  <div class="border-demo">Default border — rgba(85,83,104, 0.2)</div>
  <div class="border-demo-strong">Strong border — rgba(85,83,104, 0.4)</div>
</div>
</body>
</html>
