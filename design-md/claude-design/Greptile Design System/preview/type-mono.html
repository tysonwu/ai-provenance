<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #EEEEEE; padding: 24px 28px; }
  .divider { border: none; border-top: 1px solid rgba(85,83,104,0.15); margin: 12px 0; }
  .row { display: flex; align-items: baseline; gap: 20px; }
  .role { font-family: sans-serif; font-size: 11px; color: #787878; min-width: 130px; }
  .spec { font-family: 'Space Mono', monospace; color: #2A2A2A; }
  .bracket { font-family: 'Space Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: #555368; }
  .code-sample { font-family: 'Space Mono', monospace; font-size: 13px; background: rgba(85,83,104,0.08); border-radius: 4px; padding: 2px 8px; color: #2A2A2A; display: inline-block; }
  .step { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; color: #555368; letter-spacing: 0.05em; }
</style>
</head>
<body>
  <div class="row"><div class="role">Section label</div><div class="bracket">[ AGENT ]</div></div>
  <hr class="divider">
  <div class="row"><div class="role">Step label</div><div class="step">STEP 01</div></div>
  <hr class="divider">
  <div class="row"><div class="role">Nav link</div><span class="spec" style="font-size:12px; text-transform:uppercase; letter-spacing:0.1em;">Examples</span></div>
  <hr class="divider">
  <div class="row"><div class="role">Inline code</div><div class="code-sample">./greptile/rules</div></div>
  <hr class="divider">
  <div class="row"><div class="role">Caption / fig</div><span class="spec" style="font-size:12px; color:#555368;">fig 1. autonomous code review agent</span></div>
  <hr class="divider">
  <div class="row"><div class="role">Monospace bold</div><div class="spec" style="font-size:14px; font-weight:700; letter-spacing:0.06em;">TEST · RUN · EXECUTE</div></div>
</body>
</html>
