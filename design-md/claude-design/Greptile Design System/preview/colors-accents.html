<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #EEEEEE; font-family: 'DM Sans', sans-serif; padding: 20px; display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch { border-radius: 8px; overflow: hidden; width: 110px; }
  .swatch-color { height: 60px; }
  .swatch-info { background: #F9F7F3; padding: 6px 8px; }
  .swatch-name { font-size: 10px; font-weight: 600; color: #2A2A2A; }
  .swatch-hex  { font-family: 'Space Mono', monospace; font-size: 9px; color: #555368; margin-top: 2px; }
  .row-label { width: 100%; font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #555368; margin-top: 8px; margin-bottom: 0; }
</style>
</head>
<body>
<p class="row-label">[ Accent Palette ]</p>
<div class="swatch"><div class="swatch-color" style="background:#5882FF;"></div><div class="swatch-info"><div class="swatch-name">Periwinkle</div><div class="swatch-hex">#5882FF</div></div></div>
<div class="swatch"><div class="swatch-color" style="background:#71ADFF;"></div><div class="swatch-info"><div class="swatch-name">Sky Blue</div><div class="swatch-hex">#71ADFF</div></div></div>
<div class="swatch"><div class="swatch-color" style="background:#D6E5FF;"></div><div class="swatch-info"><div class="swatch-name">Blue Tint</div><div class="swatch-hex">#D6E5FF</div></div></div>
<div class="swatch"><div class="swatch-color" style="background:#756CF5;"></div><div class="swatch-info"><div class="swatch-name">Violet</div><div class="swatch-hex">#756CF5</div></div></div>
<div class="swatch"><div class="swatch-color" style="background:#FFCFFE;"></div><div class="swatch-info"><div class="swatch-name">Lavender</div><div class="swatch-hex">#FFCFFE</div></div></div>
<div class="swatch"><div class="swatch-color" style="background:#FFACFE;"></div><div class="swatch-info"><div class="swatch-name">Hot Pink</div><div class="swatch-hex">#FFACFE</div></div></div>
<div class="swatch"><div class="swatch-color" style="background:#F783A3;"></div><div class="swatch-info"><div class="swatch-name">Rose</div><div class="swatch-hex">#F783A3</div></div></div>
<div class="swatch"><div class="swatch-color" style="background:#FF7F59;"></div><div class="swatch-info"><div class="swatch-name">Coral</div><div class="swatch-hex">#FF7F59</div></div></div>
<div class="swatch"><div class="swatch-color" style="background:#FFBCB3;"></div><div class="swatch-info"><div class="swatch-name">Blush</div><div class="swatch-hex">#FFBCB3</div></div></div>
<div class="swatch"><div class="swatch-color" style="background:#DAFF01;"></div><div class="swatch-info"><div class="swatch-name">Acid Lime</div><div class="swatch-hex">#DAFF01</div></div></div>
<div class="swatch"><div class="swatch-color" style="background:#ECFFA3;"></div><div class="swatch-info"><div class="swatch-name">Pale Lime</div><div class="swatch-hex">#ECFFA3</div></div></div>
<div class="swatch"><div class="swatch-color" style="background:#C8EAD0;"></div><div class="swatch-info"><div class="swatch-name">Sage</div><div class="swatch-hex">#C8EAD0</div></div></div>
</body>
</html>
