<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #EEEEEE; padding: 28px 32px; font-family: 'DM Sans', sans-serif; display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }
  .section-label { font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #555368; margin-bottom: 12px; display: block; }
  .logo-block { display: flex; flex-direction: column; gap: 16px; }
  .logo-on-light { background: #F9F7F3; border-radius: 10px; padding: 20px 28px; display: flex; align-items: center; gap: 10px; }
  .logo-on-dark { background: #2A2A2A; border-radius: 10px; padding: 20px 28px; display: flex; align-items: center; gap: 10px; }
  .logo-mark-lg { width: 32px; height: 36px; }
  .wordmark-dark { height: 22px; }
  .wordmark-light { height: 22px; filter: invert(1); }
  .mark-only { background: #EEEEEE; border-radius: 10px; padding: 16px 20px; display: inline-flex; }
  .wireframe-block { background: #2A2A2A; border-radius: 10px; padding: 20px 28px; }
  .wireframe-block svg { height: 40px; width: auto; opacity: 0.5; }
</style>
</head>
<body>
<div>
  <span class="section-label">[ Logo Mark ]</span>
  <div class="logo-block">
    <div class="logo-on-light">
      <svg class="logo-mark-lg" viewBox="0 0 367 420" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M240.269 49.8154L166.804 115.963L115.966 159.44L181.335 220.585L249.784 162.048L196.78 112.47L253.068 61.7881L362.605 164.246L178.739 321.489L3.14502 157.242L187.011 0L240.269 49.8154Z" fill="#28E99F"></path>
        <rect width="236.453" height="83.4566" transform="matrix(0.75471 -0.656059 0 1 188.017 336.544)" fill="#28E99F"></rect>
        <rect width="236.453" height="83.4566" transform="matrix(0.731354 0.681998 0 1 0 174.962)" fill="#28E99F"></rect>
      </svg>
      <span style="font-family:'Space Mono',monospace;font-size:12px;color:#555368;">On light</span>
    </div>
    <div class="logo-on-dark">
      <svg class="logo-mark-lg" viewBox="0 0 367 420" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M240.269 49.8154L166.804 115.963L115.966 159.44L181.335 220.585L249.784 162.048L196.78 112.47L253.068 61.7881L362.605 164.246L178.739 321.489L3.14502 157.242L187.011 0L240.269 49.8154Z" fill="#28E99F"></path>
        <rect width="236.453" height="83.4566" transform="matrix(0.75471 -0.656059 0 1 188.017 336.544)" fill="#28E99F"></rect>
        <rect width="236.453" height="83.4566" transform="matrix(0.731354 0.681998 0 1 0 174.962)" fill="#28E99F"></rect>
      </svg>
      <span style="font-family:'Space Mono',monospace;font-size:12px;color:rgba(238,238,238,0.5);">On dark</span>
    </div>
  </div>
</div>
<div>
  <span class="section-label">[ Wordmark — Dark ]</span>
  <div class="logo-block">
    <div class="logo-on-light">
      <svg height="18" viewBox="0 0 300 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Simplified wordmark representation -->
        <text x="0" y="54" font-family="'DM Sans',sans-serif" font-size="56" font-weight="700" fill="#2A2A2A" letter-spacing="-2">Greptile</text>
      </svg>
    </div>
    <div style="background:#F9F7F3;border-radius:10px;padding:16px 20px;display:flex;align-items:center;gap:8px;">
      <svg class="logo-mark-lg" style="width:24px;height:27px;" viewBox="0 0 367 420" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M240.269 49.8154L166.804 115.963L115.966 159.44L181.335 220.585L249.784 162.048L196.78 112.47L253.068 61.7881L362.605 164.246L178.739 321.489L3.14502 157.242L187.011 0L240.269 49.8154Z" fill="#28E99F"></path>
        <rect width="236.453" height="83.4566" transform="matrix(0.75471 -0.656059 0 1 188.017 336.544)" fill="#28E99F"></rect>
        <rect width="236.453" height="83.4566" transform="matrix(0.731354 0.681998 0 1 0 174.962)" fill="#28E99F"></rect>
      </svg>
      <span style="font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;color:#2A2A2A;letter-spacing:-0.02em;">greptile</span>
    </div>
  </div>
</div>
</body>
</html>
