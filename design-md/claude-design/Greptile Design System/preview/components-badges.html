<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #EEEEEE; padding: 20px 24px; font-family: 'DM Sans', sans-serif; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .section-label { width: 100%; font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #555368; margin-top: 8px; }
  /* Bracket labels */
  .bracket { font-family: 'Space Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: #555368; }
  /* Step labels */
  .step { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; color: #555368; letter-spacing: 0.06em; }
  /* Status badges */
  .badge { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 9999px; display: inline-flex; align-items: center; gap: 5px; }
  .badge-mint { background: #C5FFD6; color: #107A4D; }
  .badge-blue { background: #D6E5FF; color: #2A4EB5; }
  .badge-coral { background: #FFBCB3; color: #8B3A2A; }
  .badge-pink { background: #FFCFFE; color: #7A1F8A; }
  .badge-lime { background: #ECFFA3; color: #5A6029; }
  .badge-outline { background: transparent; color: #555368; border: 1px solid rgba(85,83,104,0.3); }
  /* Early Access pill */
  .pill-ea { background: #DAFF01; color: #2A2A2A; font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; padding: 3px 10px; border-radius: 9999px; font-weight: 700; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
</style>
</head>
<body>
<div class="section-label">[ Bracket Labels ]</div>
<span class="bracket">[ AGENT ]</span>
<span class="bracket">[ PERSONALIZATION ]</span>
<span class="bracket">[ YOUR STACK ]</span>
<span class="bracket">[ INTRODUCING TREX ]</span>

<div class="section-label">[ Step Labels ]</div>
<span class="step">STEP 01</span>
<span class="step">STEP 02</span>
<span class="step">STEP 03</span>

<div class="section-label">[ Status Badges ]</div>
<span class="badge badge-mint"><span class="dot" style="background:#28E99F;"></span>Success</span>
<span class="badge badge-blue"><span class="dot" style="background:#5882FF;"></span>Info</span>
<span class="badge badge-coral"><span class="dot" style="background:#FF7F59;"></span>Warning</span>
<span class="badge badge-pink">Early Access</span>
<span class="badge badge-lime">New</span>
<span class="badge badge-outline">Beta</span>

<div class="section-label">[ Special Pills ]</div>
<span class="pill-ea">Early Access</span>
</body>
</html>
