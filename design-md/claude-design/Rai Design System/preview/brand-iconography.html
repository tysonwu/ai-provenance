<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background:#fff; padding:20px 24px; color:#161616; font-family:var(--font-sans); display:flex; flex-direction:column; gap:14px; }
  .label { font-size:10px; text-transform:uppercase; letter-spacing:0.32px; color:#525252; font-weight:600; }
  .row { display:flex; gap:22px; align-items:center; }
  .glyph { display:flex; flex-direction:column; gap:4px; align-items:center; font-family:var(--font-mono); font-size:10px; color:#525252; letter-spacing:0.16px; }
  .glyph .g { font-size:22px; font-family:var(--font-sans); color:#161616; }
  .svgicon { width:24px; height:24px; color:#161616; }
  svg { stroke: currentColor; }
  .group { display:flex; gap:22px; padding: 10px 14px; background:#f4f4f4; }
</style>
</head>
<body>
  <div class="label">Iconography · SVG stroke + Unicode micro-glyphs</div>
  <div class="row">
    <div class="group">
      <div class="glyph">
        <svg class="svgicon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <span>sun · theme</span>
      </div>
      <div class="glyph">
        <svg class="svgicon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <span>moon · theme</span>
      </div>
    </div>
    <div class="group">
      <div class="glyph"><span class="g" style="color:#0f62fe">●</span><span>status</span></div>
      <div class="glyph"><span class="g">▶</span><span>collapsed</span></div>
      <div class="glyph"><span class="g">▼</span><span>open</span></div>
      <div class="glyph"><span class="g" style="color:#24a148">✓</span><span>pass</span></div>
      <div class="glyph"><span class="g" style="color:#da1e28">✗</span><span>fail</span></div>
      <div class="glyph"><span class="g">⎘</span><span>tool</span></div>
    </div>
  </div>
</body>
</html>
