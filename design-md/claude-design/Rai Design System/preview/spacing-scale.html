<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background:#fff; padding: 20px 24px; color:#161616; font-family:var(--font-sans); }
  .label { font-size:10px; text-transform:uppercase; letter-spacing:0.32px; color:#525252; margin-bottom:14px; font-weight:600; }
  .row { display:flex; align-items:flex-end; gap:14px; }
  .unit { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .bar { background:#0f62fe; }
  .v { font-family:var(--font-mono); font-size:10px; color:#525252; letter-spacing:0.16px; }
</style>
</head>
<body>
  <div class="label">Spacing scale · 8px Carbon 2x grid</div>
  <div class="row">
    <div class="unit"><div class="bar" style="width:2px; height:2px"></div><div class="v">2</div><div class="v" style="opacity:.6">01</div></div>
    <div class="unit"><div class="bar" style="width:4px; height:4px"></div><div class="v">4</div><div class="v" style="opacity:.6">02</div></div>
    <div class="unit"><div class="bar" style="width:8px; height:8px"></div><div class="v">8</div><div class="v" style="opacity:.6">03</div></div>
    <div class="unit"><div class="bar" style="width:12px; height:12px"></div><div class="v">12</div><div class="v" style="opacity:.6">04</div></div>
    <div class="unit"><div class="bar" style="width:16px; height:16px"></div><div class="v">16</div><div class="v" style="opacity:.6">05</div></div>
    <div class="unit"><div class="bar" style="width:24px; height:24px"></div><div class="v">24</div><div class="v" style="opacity:.6">06</div></div>
    <div class="unit"><div class="bar" style="width:32px; height:32px"></div><div class="v">32</div><div class="v" style="opacity:.6">07</div></div>
    <div class="unit"><div class="bar" style="width:40px; height:40px"></div><div class="v">40</div><div class="v" style="opacity:.6">08</div></div>
    <div class="unit"><div class="bar" style="width:48px; height:48px"></div><div class="v">48</div><div class="v" style="opacity:.6">09</div></div>
    <div class="unit"><div class="bar" style="width:64px; height:64px"></div><div class="v">64</div><div class="v" style="opacity:.6">10</div></div>
  </div>
</body>
</html>
