<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background:#fff; padding: 20px 24px; color:#161616; font-family:var(--font-sans); display:flex; flex-direction:column; gap:14px; }
  .label { font-size:10px; text-transform:uppercase; letter-spacing:0.32px; color:#525252; font-weight:600; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button { font-family:var(--font-sans); font-size:14px; letter-spacing:0.16px; border:0; border-radius:0; cursor:pointer; height:48px; }
  .btn-primary   { background:#0f62fe; color:#fff; padding:0 63px 0 15px; }
  .btn-primary:hover { background:#0353e9; }
  .btn-secondary { background:#393939; color:#fff; padding:0 63px 0 15px; }
  .btn-tertiary  { background:transparent; color:#0f62fe; padding:0 15px; border:1px solid #0f62fe; }
  .btn-ghost     { background:transparent; color:#0f62fe; padding:0 16px; }
  .btn-ghost:hover { background:#e8e8e8; }
  .btn-danger    { background:#da1e28; color:#fff; padding:0 63px 0 15px; }
</style>
</head>
<body>
  <div class="label">Buttons · 48px default, 0 radius, asymmetric padding</div>
  <div class="row">
    <button class="btn-primary">Run now</button>
    <button class="btn-secondary">Cancel</button>
    <button class="btn-tertiary">Inspect</button>
    <button class="btn-ghost">Skip</button>
    <button class="btn-danger">Kill run</button>
  </div>
</body>
</html>
