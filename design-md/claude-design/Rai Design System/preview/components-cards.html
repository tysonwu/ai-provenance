<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background:#fff; padding: 20px 24px; color:#161616; font-family:var(--font-sans); display:grid; grid-template-columns:1fr 1fr; gap:1px; background:#e0e0e0; }
  .card { background:#f4f4f4; padding:16px; display:flex; flex-direction:column; gap:8px; cursor:pointer; }
  .card:hover { background:#e8e8e8; }
  .h4 { font-size:20px; line-height:1.40; font-weight:600; }
  .body { font-size:14px; line-height:1.29; letter-spacing:0.16px; color:#525252; }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:12px; }
  .meta { font-family:var(--font-mono); font-size:11px; color:#525252; letter-spacing:0.16px; }
  .arrow { color:#0f62fe; font-size:16px; }
  .white { background:#fff; }
  .white:hover { background:#f4f4f4; }
</style>
</head>
<body>
  <div class="card">
    <div class="h4">Latest briefing</div>
    <div class="body">Funding skew narrowed 12 bps across the BTC perpetuals basket.</div>
    <div class="row"><span class="meta">2m ago · 4 tools</span><span class="arrow">→</span></div>
  </div>
  <div class="card white">
    <div class="h4">Run 8f3c</div>
    <div class="body">Completed with tool errors on Binance endpoint — retry scheduled.</div>
    <div class="row"><span class="meta">14m ago · 2.1s</span><span class="arrow">→</span></div>
  </div>
</body>
</html>
