<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background:#fff; padding: 20px 24px; color:#161616; font-family: var(--font-sans); }
  .row { display:grid; grid-template-columns: 1fr 190px; align-items:baseline; gap:16px; padding: 6px 0; border-bottom: 1px solid #e0e0e0; }
  .row:last-child { border-bottom:0; }
  .meta { font-family:var(--font-mono); font-size:10px; color:#525252; letter-spacing:0.16px; }
</style>
</head>
<body>
  <div class="row"><div style="font-size:32px; line-height:1.25; font-weight:400;">Heading 02 section title</div><div class="meta">32/40 · 400</div></div>
  <div class="row"><div style="font-size:24px; line-height:1.33; font-weight:400;">Heading 03 sub-section</div><div class="meta">24/32 · 400</div></div>
  <div class="row"><div style="font-size:20px; line-height:1.40; font-weight:600;">Heading 04 card title</div><div class="meta">20/28 · 600</div></div>
  <div class="row"><div style="font-size:20px; line-height:1.40; font-weight:400;">Heading 05 card title light</div><div class="meta">20/28 · 400</div></div>
</body>
</html>
